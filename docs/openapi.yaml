openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts App
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: This is a documentation of contacts app

tags:
  - name: Contacts
    description: Operations about users.
  - name: Auth
    description: Auth operations.

servers:
  - url: http://localhost:3000
  - url: https://nodejs-hw-mongodb-46jy.onrender.com

paths:
  /contacts:
    get:
      $ref: './swagger/paths/contacts/get.yaml'
    post:
      $ref: './swagger/paths/contacts/post.yaml'

  /contacts/{contactId}:
    patch:
      $ref: './swagger/paths/{id}/patch.yaml'
    delete:
      $ref: './swagger/paths/{id}/delete.yaml'
    get:
      $ref: './swagger/paths/{id}/get.yaml'

  #  AUTH ENDPOINTS
  /auth/register:
    post:
      $ref: './swagger/paths/auth/register.yaml'

  /auth/login:
    post:
      $ref: './swagger/paths/auth/login.yaml'

  /auth/send-reset-email:
    post:
      $ref: './swagger/paths/auth/send-reset-email.yaml'

  /auth/reset-pwd:
    post:
      $ref: './swagger/paths/auth/reset-password.yaml'

  /auth/refresh:
    post:
      $ref: './swagger/paths/auth/refresh.yaml'

  /auth/logout:
    post:
      $ref: './swagger/paths/auth/logout.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
