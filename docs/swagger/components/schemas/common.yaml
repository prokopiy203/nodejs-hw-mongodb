DefaultResponse:
  type: object
  properties:
    status:
      type: integer
      example: 200
    message:
      type: string
      example: Operation successful
    data:
      type: object
      example: {}

ErrorResponse:
  type: object
  properties:
    status:
      type: integer
      example: 400
    message:
      type: string
      example: Bad Request
