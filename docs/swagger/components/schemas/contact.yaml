type: object
required:
  - _id
  - userId
  - name
  - phoneNumber
  - contactType
  - createdAt
  - updatedAt
properties:
  _id:
    type: string
    example: '650fdbae8f8a1f001e36a1df'
  userId:
    type: string
    example: '650fdbae8f8a1f001e36a1de'
  name:
    type: string
    example: 'John Doe'
  phoneNumber:
    type: number
    example: 3809312234567
  email:
    type:
      - string
      - 'null'
    example: 'john.doe@example.com'
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    enum: ['home', 'personal']
    example: 'home'
  photo:
    type:
      - string
      - 'null'
    example: 'https://res.cloudinary.com/dbmy1ukhf/image/upload/v1757459374/nzldt2hg1ru7qizpla9q.jpg'
  createdAt:
    type: string
    format: date-time
    example: '2025-09-09T23:08:50.214Z'
  updatedAt:
    type: string
    format: date-time
    example: '2025-09-09T23:08:50.214Z'
