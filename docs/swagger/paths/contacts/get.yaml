tags:
  - Contacts
summary: Get list of Contacts
operationId: getContacts
description: Get list of contacts for the authenticated user with optional filters, pagination and sorting.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      default: 1
    example: 1
    description: Page number for pagination
  - in: query
    name: perPage
    schema:
      type: integer
      default: 10
    example: 10
    description: Number of items per page
  - in: query
    name: sortBy
    schema:
      type: string
      default: '_id'
      example: 'name'
    description: Field to sort by (_id)
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
      default: asc
    example: 'desc'
    description: Sort order
  - in: query
    name: isFavourite
    schema:
      type: boolean
    example: true
    description: Filter by favourite contacts
  - in: query
    name: contactType
    schema:
      type: string
      enum: ['home', 'personal']
    example: 'home'
    description: Filter by contact type
responses:
  '200':
    description: Successfully retrieved contacts list
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - name
                      - email
                      - phone
                    properties:
                      id:
                        type: string
                        example: '650fdbae8f8a1f001e36a1df'
                      name:
                        type: string
                        example: 'John Doe'
                      email:
                        type: string
                        format: email
                        example: 'john.doe@example.com'
                      phone:
                        type: string
                        example: '+1234567890'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 50
                totalPages:
                  type: integer
                  example: 5
                hasNextPage:
                  type: boolean
                  example: true
                hasPreviousPage:
                  type: boolean
                  example: false
  '401':
    $ref: '../../components/responses/401.yaml'
