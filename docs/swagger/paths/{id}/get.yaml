tags:
  - Contacts
summary: Get contact by ID
operationId: getContactsById
description: 'Get a single contact by its unique identifier'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '650fdbae8f8a1f001e36a1df'
    description: The ID of the contact
responses:
  '200':
    description: Successfully found contact!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 650fdbae8f8a1f001e36a1df
            data:
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'

  '404':
    description: Contact not found
