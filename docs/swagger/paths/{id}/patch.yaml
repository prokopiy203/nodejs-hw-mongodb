tags:
  - Contacts
summary: Update contact by ID
operationId: updateContact
description: Update an existing contact by its ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    example: '650fdbae8f8a1f001e36a1df'
    description: The ID of the contact to update
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Jane Doe
          phoneNumber:
            type: string
            example: '+380931234568'
          email:
            type: string
            example: jane@example.com
          isFavourite:
            type: boolean
            example: true
          contactType:
            type: string
            enum: [home, personal]
            example: home
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: '../../components/schemas/contact.yaml'
  '404':
    $ref: ../../components/responses/404.yaml
    description: Contact not found
  '401':
    $ref: '../../components/responses/401.yaml'
  '400':
    $ref: '../../components/responses/400.yaml'
